<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Midterms — Soundbites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ivory: #f3ead8;
    --muted: #b7aa90;
    --gold: #d4a85a;
    --gold-2: #f0d08a;
    --ink: #12100c;
    --panel: #1b1812;
    --line: #3a3428;
    --left: #6ea0ff;
    --right: #ff6b5a;
    --booth: #e0c070;
    --keep: #7dba7a;
    --skip: #c45b4a;
    --used: #d4a85a;
    --ok: #8fbf7a;
    --miss: #8a7d6c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: var(--ivory); }
  body {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(110,160,255,.08), transparent 50%),
      radial-gradient(900px 500px at 110% 0%, rgba(255,107,90,.08), transparent 46%),
      repeating-conic-gradient(from 0deg at 0 0, #14120e 0 90deg, #16130f 0 180deg);
    background-size: auto, auto, 28px 28px;
    padding-bottom: 300px;
  }
  header {
    position: sticky; top: 0; z-index: 20;
    backdrop-filter: blur(14px);
    background: linear-gradient(180deg, rgba(18,16,12,.94), rgba(18,16,12,.78));
    border-bottom: 1px solid var(--line);
    padding: 18px 22px 14px;
  }
  .mast {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  h1 {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 700; letter-spacing: .14em;
    font-size: clamp(28px, 4vw, 42px);
    margin: 0; text-transform: uppercase;
  }
  h1 span { color: var(--gold); }
  .count { color: var(--muted); font-size: 12px; letter-spacing: .04em; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
  input[type="search"] {
    background: #0e0c09; color: var(--ivory);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 14px; min-width: min(100%, 240px);
    font: inherit; outline: none;
  }
  input[type="search"]:focus { border-color: var(--gold); }
  .chip, .tab {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    font-size: 13px; border: 1px solid var(--line);
    background: transparent; color: var(--muted);
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
  }
  .chip.on, .tab.on { background: var(--ivory); color: var(--ink); border-color: var(--ivory); }
  .tab.left.on { background: var(--left); color: #0b1220; border-color: var(--left); }
  .tab.right.on { background: var(--right); color: #2a0908; border-color: var(--right); }
  .tab.booth.on { background: var(--booth); color: #1a1508; border-color: var(--booth); }
  main { max-width: 1100px; margin: 0 auto; padding: 22px 18px 40px; }
  .speaker {
    margin: 28px 0 10px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    border-bottom: 1px solid var(--line); padding-bottom: 6px;
  }
  .speaker h2 {
    font-family: "Barlow Condensed", sans-serif;
    font-size: 22px; letter-spacing: .16em; text-transform: uppercase; margin: 0;
  }
  .speaker .n { color: var(--muted); font-size: 11px; }
  .house-left h2 { color: var(--left); }
  .house-right h2 { color: var(--right); }
  .house-commentators h2 { color: var(--booth); }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .card {
    display: grid;
    grid-template-columns: 52px 1fr auto;
    gap: 12px; align-items: center;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    cursor: pointer;
    scroll-margin-top: 140px;
    transition: border-color .15s, transform .12s, background .15s;
  }
  .card:hover { border-color: var(--gold); transform: translateY(-1px); }
  .card.playing {
    border-color: var(--gold-2);
    background: linear-gradient(90deg, rgba(212,168,90,.12), var(--panel) 42%);
    box-shadow: 0 0 0 1px rgba(212,168,90,.25);
  }
  .card.missing { opacity: .45; cursor: default; }
  .card.missing:hover { transform: none; border-color: var(--line); }
  .card.used { border-left: 4px solid var(--used); }
  .playbtn {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid var(--gold);
    background: #0e0c09; color: var(--gold-2);
    display: grid; place-items: center;
    font-size: 16px; pointer-events: none;
  }
  .card.playing .playbtn { background: var(--gold); color: var(--ink); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .quote {
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto;
    font-size: clamp(17px, 2.2vw, 22px);
    font-weight: 500; line-height: 1.25; margin: 0;
  }
  .meta { color: var(--muted); font-size: 11px; margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    font-family: "Barlow Condensed", sans-serif;
    letter-spacing: .08em; text-transform: uppercase; font-size: 11px;
    border: 1px solid var(--line); padding: 1px 7px; border-radius: 999px;
  }
  .pill.hand { color: var(--gold); border-color: var(--gold); }
  .actions { display: flex; flex-direction: column; gap: 4px; min-width: 88px; }
  .use {
    font-family: "Barlow Condensed", sans-serif;
    letter-spacing: .08em; text-transform: uppercase; font-size: 11px;
    background: transparent; color: var(--muted);
    border: 1px dashed var(--line); border-radius: 6px;
    padding: 5px 8px; cursor: pointer; text-align: center;
  }
  .use.on { color: var(--gold); border-color: var(--gold); border-style: solid; background: rgba(212,168,90,.14); }
  .use:disabled { opacity: .35; cursor: default; }
  .use.filmed { color: var(--gold-2); border-color: var(--gold-2); border-style: solid; }
  #reelBox {
    display: none; position: fixed; inset: 0; z-index: 40;
    background: rgba(8,7,5,.82); align-items: center; justify-content: center;
    padding: 24px;
  }
  #reelBox.on { display: flex; }
  #reelBox video {
    width: min(960px, 92vw); max-height: 70vh;
    aspect-ratio: 16 / 9; border-radius: 12px;
    border: 1px solid var(--gold); background: #000; object-fit: contain;
  }
  #reelBox .reel-cap {
    position: absolute; bottom: 28px; left: 0; right: 0;
    text-align: center; color: var(--ivory); font-family: Fraunces, serif; font-size: 18px;
  }
  #reelClose {
    position: absolute; top: 18px; right: 18px;
    font-family: "Barlow Condensed", sans-serif; letter-spacing: .08em; text-transform: uppercase;
    background: var(--ivory); color: var(--ink); border: 0; border-radius: 999px;
    padding: 8px 14px; cursor: pointer; font-weight: 700;
  }
  .empty { color: var(--muted); padding: 40px 8px; text-align: center; }
  #dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: #0c0b09;
    border-top: 1px solid var(--gold);
    padding: 10px 18px 12px;
    display: grid; gap: 8px;
  }
  #dock .who { font-family: "Barlow Condensed", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); font-size: 12px; }
  #dock .nowq { font-family: "Fraunces", serif; font-size: 18px; margin: 2px 0 0; }
  .dock-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .sel-meta { color: var(--muted); font-size: 11px; text-align: right; }
  .sel-meta b { color: var(--gold-2); font-weight: 500; }
  #waveWrap {
    position: relative; height: 96px; border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden; background: #14110c; cursor: ew-resize;
    touch-action: none;
  }
  #wave { display: block; width: 100%; height: 96px; }
  #waveHint {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--muted); font-size: 12px; pointer-events: none;
  }
  .dock-btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .dock-btns button, .nudge {
    font-family: "Barlow Condensed", sans-serif; letter-spacing: .08em; text-transform: uppercase;
    background: var(--ivory); color: var(--ink); border: 0; border-radius: 999px;
    padding: 8px 14px; cursor: pointer; font-weight: 700;
  }
  .dock-btns button.ghost, .nudge { background: transparent; color: var(--ivory); border: 1px solid var(--line); }
  .dock-btns button.save { background: var(--gold); color: var(--ink); }
  .dock-btns button.save:disabled { opacity: .4; cursor: default; }
  .nudge { padding: 6px 9px; font-size: 12px; }
  .nudge-group { display: flex; gap: 4px; align-items: center; color: var(--muted); font-size: 11px; }
  a.src { color: var(--gold); text-decoration: none; }
  a.src:hover { text-decoration: underline; }
  #cutStatus { color: var(--keep); font-size: 12px; min-height: 1em; }
  #cutStatus.err { color: var(--skip); }
  @media (max-width: 720px) {
    header { padding: 12px 12px 10px; }
    h1 { font-size: 26px; letter-spacing: .1em; }
    .controls {
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .controls::-webkit-scrollbar { display: none; }
    input[type="search"] { min-width: 170px; flex: 0 0 auto; }
    .chip, .tab { flex: 0 0 auto; }
    .card { grid-template-columns: 40px 1fr auto; scroll-margin-top: 120px; }
    .actions { flex-direction: column; }
    body { padding-bottom: 340px; }
    #waveWrap, #wave { height: 80px; }
  }
</style>
</head>
<body>
<header>
  <div class="mast">
    <h1>The Midterms <span>Soundbites</span></h1>
    <div class="count" id="stats"></div>
  </div>
  <div class="controls">
    <input type="search" id="q" placeholder="Search quote or name…" autocomplete="off">
    <button class="tab on" data-house="all">All</button>
    <button class="tab booth" data-house="commentators">Booth</button>
    <button class="tab left" data-house="left">Left</button>
    <button class="tab right" data-house="right">Right</button>
    <button class="chip on" data-trig="all">Any beat</button>
    <button class="chip" data-trig="check">Check</button>
    <button class="chip" data-trig="capture">Capture</button>
    <button class="chip" data-trig="mate">Mate</button>
    <button class="chip" data-trig="blunder">Blunder</button>
    <button class="chip" data-trig="trash talk">Trash</button>
    <button class="chip" data-trig="hype">Hype</button>
    <button class="chip" data-trig="got captured">Got captured</button>
    <button class="chip" data-trig="captures">Captures</button>
    <button class="chip on" id="readyOnly">Ready only</button>
    <button class="chip" data-use="click">On click</button>
    <button class="chip" data-use="captured">On capture</button>
    <button class="chip" data-use="order">On order</button>
    <button class="chip" id="playVisible">Play visible</button>
  </div>
</header>
<main id="board"></main>
<div id="dock">
  <div class="dock-top">
    <div>
      <div class="who" id="nowWho">Click a line</div>
      <div class="nowq" id="nowQuote">Nothing playing</div>
    </div>
    <div class="sel-meta" id="selMeta">Trim the gold region. Click / Captured / Order on a card is where it plays.</div>
  </div>
  <div id="waveWrap">
    <canvas id="wave"></canvas>
    <div id="waveHint">Pick a bite to load ~15s of pad on each side</div>
  </div>
  <div class="dock-btns">
    <button class="ghost" id="prev">Prev</button>
    <button id="replay">Play cut</button>
    <button class="ghost" id="next">Next</button>
    <button class="ghost" id="loopBtn">Loop on</button>
    <span class="nudge-group">In
      <button class="nudge" data-edge="in" data-d="-0.1">−0.1</button>
      <button class="nudge" data-edge="in" data-d="0.1">+0.1</button>
    </span>
    <span class="nudge-group">Out
      <button class="nudge" data-edge="out" data-d="-0.1">−0.1</button>
      <button class="nudge" data-edge="out" data-d="0.1">+0.1</button>
    </span>
    <button class="save" id="saveCut" disabled>Save cut</button>
    <button class="ghost" id="resetCut">Reset</button>
    <button class="ghost" id="previewBark">Preview bark</button>
    <span id="cutStatus"></span>
  </div>
</div>
<audio id="player" preload="auto"></audio>
<div id="reelBox">
  <button type="button" id="reelClose">Close</button>
  <video id="reelVideo" controls playsinline></video>
  <div class="reel-cap" id="reelCap"></div>
</div>
<script src="clips-data.js?v=newsom-davos-1"></script>
<script>
(function () {
  const API = (location.protocol === "file:") ? "http://127.0.0.1:8765" : "";
  let clips = window.CLIPS || [];
  const player = document.getElementById("player");
  const board = document.getElementById("board");
  const canvas = document.getElementById("wave");
  const wrap = document.getElementById("waveWrap");
  const hint = document.getElementById("waveHint");
  const state = {
    house: "all", trig: "all", use: "all", q: "", readyOnly: true,
    current: null, queue: [], loop: true,
    selStart: 0, selEnd: 0, origStart: 0, origEnd: 0, extDur: 0,
    peaks: null, drag: null
  };
  const waves = new Map();
  let actx = null;

  const fmt = (n) => (n == null || isNaN(n) ? "—" : (n < 10 ? n.toFixed(2) : n.toFixed(1)) + "s");
  const dur = (n) => n == null ? "" : (n < 10 ? n.toFixed(1) + "s" : Math.round(n) + "s");
  const MIN = 0.25;

  function visible() {
    const q = state.q.trim().toLowerCase();
    return clips.filter((c) => {
      if (state.house !== "all" && c.group !== state.house) return false;
      if (state.trig === "captures") {
        if (!c.target) return false;
      } else if (state.trig !== "all" && c.trigger !== state.trig) return false;
      if (state.readyOnly && !c.src) return false;
      if (state.use === "click" && !c.bark) return false;
      if (state.use === "captured" && !c.lastWord) return false;
      if (state.use === "order" && !c.order) return false;
      if (q && !((c.quote + " " + c.name + " " + c.id + " " + (c.targetName || "")).toLowerCase().includes(q))) return false;
      return true;
    });
  }

  function render() {
    let rows = visible();
    if (state.trig === "captures") {
      const cap = (c) => (c.speaker === "trump" ? 0 : 1);
      rows = rows.slice().sort((a, b) => cap(a) - cap(b) || String(a.target).localeCompare(String(b.target)) || a.id.localeCompare(b.id));
    }
    state.queue = rows.filter((c) => c.src).map((c) => c.id);
    const ready = clips.filter((c) => c.src).length;
    const nClick = clips.filter((c) => c.bark).length;
    const nCap = clips.filter((c) => c.lastWord).length;
    const nOrd = clips.filter((c) => c.order).length;
    document.getElementById("stats").textContent =
      ready + " / " + clips.length + " ready · " +
      nClick + " click · " + nCap + " captured · " + nOrd + " order · " +
      rows.length + " showing";
    if (!rows.length) {
      board.innerHTML = '<p class="empty">Nothing in this filter.</p>';
      return;
    }
    const groups = [];
    rows.forEach((c) => {
      const last = groups[groups.length - 1];
      const capName = state.trig === "captures" && c.target
        ? (c.name + " → " + (c.targetName || c.target))
        : c.name;
      const capKey = state.trig === "captures" ? (c.speaker + ":" + c.target) : c.speaker;
      if (!last || last.key !== capKey) groups.push({ key: capKey, speaker: c.speaker, name: capName, group: c.group, items: [c] });
      else last.items.push(c);
    });
    board.innerHTML = groups.map((g) => {
      const nReady = g.items.filter((c) => c.src).length;
      return `<section class="house-${g.group}">
        <div class="speaker"><h2>${g.name}</h2><span class="n">${nReady}/${g.items.length}</span></div>
        <div class="list">${g.items.map(card).join("")}</div>
      </section>`;
    }).join("");
    board.querySelectorAll(".card[data-id]").forEach((el) => {
      el.addEventListener("click", (e) => {
        if (e.target.closest(".use") || e.target.closest("a") || e.target.closest("#reelBox")) return;
        const id = el.dataset.id;
        const c = clips.find((x) => x.id === id);
        if (c && c.src) play(id);
      });
    });
    board.querySelectorAll(".use").forEach((el) => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        if (el.disabled) return;
        const id = el.closest(".card").dataset.id;
        if (el.dataset.use === "reel") {
          openReel(id);
          return;
        }
        toggleUse(id, el.dataset.use);
      });
    });
    highlight();
  }

  function card(c) {
    const used = c.bark || c.lastWord || c.order;
    const cls = ["card", c.src ? "" : "missing", used ? "used" : "", state.current === c.id ? "playing" : ""]
      .filter(Boolean).join(" ");
    const src = c.url ? `<a class="src" href="${c.url}" target="_blank" rel="noreferrer">source</a>` : "";
    const pieceOk = !!(c.pieceId && c.src);
    const orderOk = !!(c.target && c.src);
    return `<article class="${cls}" data-id="${c.id}">
      <div class="playbtn">${c.src ? (state.current === c.id && !player.paused ? "❚❚" : "▶") : "–"}</div>
      <div>
        <p class="quote">“${esc(c.quote)}”</p>
        <div class="meta">
          <span class="pill">${esc(c.trigger)}</span>
          ${c.targetName ? `<span class="pill hand">vs ${esc(c.targetName)}</span>` : ""}
          ${c.fate ? `<span class="pill hand">${esc(c.fate)}</span>` : ""}
          ${c.handful ? '<span class="pill hand">priority</span>' : ""}
          <span class="dur">${dur(c.duration)}</span>
          ${src}
          ${c.src ? "" : `<span>${esc(c.error || "missing")}</span>`}
        </div>
      </div>
      <div class="actions" role="group" aria-label="Where this plays">
        <button class="use ${c.bark ? "on" : ""}" data-use="click" ${pieceOk ? "" : "disabled"} title="When you click this piece">Click</button>
        <button class="use ${c.lastWord ? "on" : ""}" data-use="captured" ${pieceOk ? "" : "disabled"} title="When this piece is taken">Captured</button>
        <button class="use ${c.order ? "on" : ""}" data-use="order" ${orderOk ? "" : "disabled"} title="When the king orders this capture">Order</button>
        <button class="use ${c.reel ? "filmed" : ""}" data-use="reel" ${c.src ? "" : "disabled"} title="${c.reel ? "Play the defeated reel" : "Build the defeated reel if a mute bed exists"}">${c.reel ? "Reel" : "Film"}</button>
      </div>
    </article>`;
  }

  function esc(s) {
    return String(s || "").replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[ch]));
  }

  function currentClip() {
    return clips.find((x) => x.id === state.current);
  }

  function isDirty() {
    return Math.abs(state.selStart - state.origStart) > 0.02 || Math.abs(state.selEnd - state.origEnd) > 0.02;
  }

  function selMeta() {
    const c = currentClip();
    if (!c) return;
    const pad = (c.padBefore != null)
      ? `pad ${fmt(c.padBefore)} / ${fmt(c.padAfter)}`
      : "tight clip (no pad file yet)";
    document.getElementById("selMeta").innerHTML =
      `In <b>${fmt(state.selStart)}</b> · Out <b>${fmt(state.selEnd)}</b> · Cut <b>${fmt(state.selEnd - state.selStart)}</b><br>${pad}`;
    document.getElementById("saveCut").disabled = !c.extended || !isDirty();
  }

  function play(id) {
    const c = clips.find((x) => x.id === id);
    if (!c || !c.src) return;
    if (state.current === id) {
      if (player.paused) {
        if (player.currentTime < state.selStart || player.currentTime >= state.selEnd - 0.03)
          player.currentTime = state.selStart;
        player.play().catch(() => {});
      } else player.pause();
      highlight();
      return;
    }
    state.current = id;
    state.extDur = c.extDuration || c.duration || 0;
    state.selStart = c.selStart != null ? c.selStart : 0;
    state.selEnd = c.selEnd != null ? c.selEnd : (c.duration || state.extDur || 1);
    state.origStart = state.selStart;
    state.origEnd = state.selEnd;
    state.peaks = waves.get(id) || null;
    const src = asset(c.extended || c.src);
    player.src = src;
    player.onloadedmetadata = () => {
      if (player.duration && isFinite(player.duration)) state.extDur = player.duration;
      if (state.selEnd > state.extDur) state.selEnd = state.extDur;
      player.currentTime = state.selStart;
      player.play().catch(() => {});
      draw();
      selMeta();
    };
    document.getElementById("nowWho").textContent = c.name + " · " + c.trigger;
    document.getElementById("nowQuote").textContent = "“" + c.quote + "”";
    document.getElementById("cutStatus").textContent = "";
    hint.style.display = "none";
    selMeta();
    highlight();
    draw();
    loadWave(id, src);
  }

  async function loadWave(id, src) {
    if (waves.has(id)) { state.peaks = waves.get(id); draw(); return; }
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") await actx.resume();
      const buf = await (await fetch(src)).arrayBuffer();
      const audio = await actx.decodeAudioData(buf.slice(0));
      const data = audio.getChannelData(0);
      const buckets = 900;
      const peaks = new Float32Array(buckets);
      const spb = Math.max(1, Math.floor(data.length / buckets));
      for (let i = 0; i < buckets; i++) {
        let m = 0;
        const a = i * spb;
        for (let j = 0; j < spb; j += 4) {
          const v = Math.abs(data[a + j] || 0);
          if (v > m) m = v;
        }
        peaks[i] = m;
      }
      waves.set(id, peaks);
      if (state.current === id) { state.peaks = peaks; draw(); }
    } catch (err) {
      console.warn("wave", err);
    }
  }

  function xToT(x) {
    const r = wrap.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, (x - r.left) / r.width));
    return p * (state.extDur || 1);
  }
  function tToX(t) {
    const r = wrap.getBoundingClientRect();
    return (t / (state.extDur || 1)) * r.width;
  }

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const w = wrap.clientWidth || 600;
    const h = wrap.clientHeight || 96;
    if (canvas.width !== Math.floor(w * dpr) || canvas.height !== Math.floor(h * dpr)) {
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
    }
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const durT = state.extDur || 1;
    const inX = (state.selStart / durT) * w;
    const outX = (state.selEnd / durT) * w;
    ctx.fillStyle = "#1a1712";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "rgba(212,168,90,0.16)";
    ctx.fillRect(inX, 0, Math.max(2, outX - inX), h);
    if (state.peaks) {
      const n = state.peaks.length;
      const mid = h / 2;
      for (let i = 0; i < n; i++) {
        const x = (i / n) * w;
        const amp = state.peaks[i] * (h * 0.42);
        const inside = x >= inX && x <= outX;
        ctx.fillStyle = inside ? "#f0d08a" : "#5a5346";
        ctx.fillRect(x, mid - amp, Math.max(1, w / n - 0.3), amp * 2);
      }
    }
    ctx.fillStyle = "#d4a85a";
    ctx.fillRect(inX - 2, 0, 4, h);
    ctx.fillRect(outX - 2, 0, 4, h);
    ctx.beginPath();
    ctx.moveTo(inX + 2, 10); ctx.lineTo(inX + 10, 18); ctx.lineTo(inX + 2, 26);
    ctx.moveTo(outX - 2, 10); ctx.lineTo(outX - 10, 18); ctx.lineTo(outX - 2, 26);
    ctx.fill();
    if (!player.paused || player.currentTime > 0) {
      const px = (player.currentTime / durT) * w;
      ctx.fillStyle = "#fff6d8";
      ctx.fillRect(px, 0, 1.5, h);
    }
  }

  function clampSel() {
    const d = state.extDur || 1;
    state.selStart = Math.max(0, Math.min(state.selStart, d - MIN));
    state.selEnd = Math.max(state.selStart + MIN, Math.min(state.selEnd, d));
  }

  wrap.addEventListener("pointerdown", (e) => {
    if (!state.current || !state.extDur) return;
    wrap.setPointerCapture(e.pointerId);
    const t = xToT(e.clientX);
    const inX = tToX(state.selStart);
    const outX = tToX(state.selEnd);
    const x = e.clientX - wrap.getBoundingClientRect().left;
    if (Math.abs(x - inX) < 14) state.drag = { kind: "in" };
    else if (Math.abs(x - outX) < 14) state.drag = { kind: "out" };
    else if (t > state.selStart && t < state.selEnd) state.drag = { kind: "slip", at: t, in0: state.selStart, out0: state.selEnd };
    else if (t < state.selStart) { state.selStart = t; clampSel(); }
    else { state.selEnd = t; clampSel(); }
    selMeta();
    draw();
  });
  wrap.addEventListener("pointermove", (e) => {
    if (!state.drag) return;
    const t = xToT(e.clientX);
    if (state.drag.kind === "in") state.selStart = Math.min(t, state.selEnd - MIN);
    else if (state.drag.kind === "out") state.selEnd = Math.max(t, state.selStart + MIN);
    else if (state.drag.kind === "slip") {
      const delta = t - state.drag.at;
      const span = state.drag.out0 - state.drag.in0;
      let ns = state.drag.in0 + delta;
      ns = Math.max(0, Math.min(ns, (state.extDur || 1) - span));
      state.selStart = ns;
      state.selEnd = ns + span;
    }
    clampSel();
    selMeta();
    draw();
  });
  wrap.addEventListener("pointerup", () => { state.drag = null; });
  wrap.addEventListener("pointercancel", () => { state.drag = null; });

  function highlight() {
    document.querySelectorAll(".card").forEach((el) => {
      el.classList.toggle("playing", el.dataset.id === state.current);
      const c = clips.find((x) => x.id === el.dataset.id);
      const btn = el.querySelector(".playbtn");
      if (btn && c && c.src) btn.textContent = (el.dataset.id === state.current && !player.paused) ? "❚❚" : "▶";
    });
  }

  function step(dir) {
    const q = state.queue;
    if (!q.length) return;
    let i = q.indexOf(state.current);
    if (i < 0) i = dir > 0 ? -1 : 0;
    const n = q[(i + dir + q.length) % q.length];
    play(n);
    const el = document.querySelector('.card[data-id="' + n + '"]');
    if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
  }

  function playCut() {
    if (!state.current) {
      if (state.queue[0]) play(state.queue[0]);
      return;
    }
    player.currentTime = state.selStart;
    player.play().catch(() => {});
  }

  player.addEventListener("timeupdate", () => {
    if (state.extDur && player.currentTime >= state.selEnd - 0.02) {
      if (state.loop) player.currentTime = state.selStart;
      else player.pause();
    }
    draw();
  });
  player.addEventListener("ended", () => {
    if (state.loop) playCut();
  });
  player.addEventListener("play", highlight);
  player.addEventListener("pause", highlight);

  document.getElementById("replay").onclick = playCut;
  document.getElementById("prev").onclick = () => step(-1);
  document.getElementById("next").onclick = () => step(1);
  document.getElementById("playVisible").onclick = () => {
    if (state.queue[0]) play(state.queue[0]);
  };
  document.getElementById("loopBtn").onclick = function () {
    state.loop = !state.loop;
    this.textContent = state.loop ? "Loop on" : "Loop off";
    this.classList.toggle("on", state.loop);
  };
  document.querySelectorAll(".nudge").forEach((b) => {
    b.onclick = () => {
      const d = parseFloat(b.dataset.d);
      if (b.dataset.edge === "in") state.selStart += d;
      else state.selEnd += d;
      clampSel();
      selMeta();
      draw();
    };
  });
  document.getElementById("saveCut").onclick = async () => {
    const c = currentClip();
    if (!c || !c.extended) {
      setStatus("No padded file to cut from. Run the local server after building extended audio.", true);
      return;
    }
    setStatus("Saving…");
    try {
      const res = await fetch(API + "/api/cut", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: c.id, start: state.selStart, end: state.selEnd })
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error((data && data.error) || ("save failed (" + res.status + ")"));
      const i = clips.findIndex((x) => x.id === c.id);
      clips[i] = Object.assign(clips[i], data.clip);
      state.origStart = state.selStart;
      state.origEnd = state.selEnd;
      selMeta();
      const durEl = document.querySelector('.card[data-id="' + c.id + '"] .dur');
      if (durEl) durEl.textContent = dur(data.clip.duration);
      setStatus("Saved " + fmt(data.clip.duration) + " clip");
    } catch (err) {
      const msg = (err && err.message) || "";
      if (/failed to fetch|networkerror|load failed/i.test(msg) || msg === "") {
        setStatus("Can't reach the recut server. Open http://127.0.0.1:8765/  (double-click Open Soundbites.command)", true);
      } else {
        setStatus(msg, true);
      }
    }
  };
  async function postJson(path, body) {
    const res = await fetch(API + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "request failed");
    return data;
  }

  function applyClip(data) {
    if (!data.clip) return;
    const i = clips.findIndex((x) => x.id === data.clip.id);
    if (i >= 0) clips[i] = Object.assign(clips[i], data.clip);
    const c = data.clip;
    const durEl = document.querySelector('.card[data-id="' + c.id + '"] .dur');
    if (durEl && c.duration != null) durEl.textContent = dur(c.duration);
    const cardEl = document.querySelector('.card[data-id="' + c.id + '"]');
    if (cardEl) {
      cardEl.classList.toggle("used", !!(c.bark || c.lastWord || c.order));
      cardEl.querySelectorAll(".use").forEach((btn) => {
        const slot = btn.dataset.use;
        if (slot === "reel") {
          btn.classList.toggle("filmed", !!c.reel);
          btn.textContent = c.reel ? "Reel" : "Film";
          btn.title = c.reel ? "Play the defeated reel" : "Build the defeated reel if a mute bed exists";
          return;
        }
        btn.classList.toggle("on", slot === "click" ? !!c.bark : slot === "captured" ? !!c.lastWord : !!c.order);
      });
    }
    const ready = clips.filter((x) => x.src).length;
    document.getElementById("stats").textContent =
      ready + " / " + clips.length + " ready · " +
      clips.filter((x) => x.bark).length + " click · " +
      clips.filter((x) => x.lastWord).length + " captured · " +
      clips.filter((x) => x.order).length + " order · " +
      visible().length + " showing";
  }

  const USE_MSG = {
    click: ["Click bark — plays when you click the piece", "Removed click bark"],
    captured: ["Last word — plays when they get taken", "Removed last word"],
    order: ["Capture order — plays when the king orders this take", "Removed capture order"]
  };

  function closeReel() {
    const box = document.getElementById("reelBox");
    const vid = document.getElementById("reelVideo");
    box.classList.remove("on");
    vid.pause();
    vid.removeAttribute("src");
    vid.load();
  }

  function showReel(src, quote, poster) {
    const box = document.getElementById("reelBox");
    const vid = document.getElementById("reelVideo");
    player.pause();
    document.getElementById("reelCap").textContent = quote ? "“" + quote + "”" : "";
    if (poster) vid.poster = asset(poster);
    else vid.removeAttribute("poster");
    vid.src = asset(src);
    box.classList.add("on");
    vid.play().catch(() => {});
  }

  async function openReel(id) {
    const c = clips.find((x) => x.id === id);
    if (!c) return;
    if (c.reel) {
      showReel(c.reel, c.quote, c.poster);
      return;
    }
    setStatus("Building defeated reel…");
    try {
      const data = await postJson("/api/reel", { id: c.id });
      applyClip(data);
      if (data.clip && data.clip.reel) {
        showReel(data.clip.reel, data.clip.quote, data.clip.poster);
        setStatus("Defeated reel ready");
      }
    } catch (err) {
      setStatus(err.message || "no defeated reel filmed yet", true);
    }
  }

  async function toggleUse(id, slot) {
    const c = clips.find((x) => x.id === id);
    if (!c || !c.src) return;
    const on = slot === "click" ? !c.bark : slot === "captured" ? !c.lastWord : !c.order;
    if (on && state.current === id && isDirty() && c.extended) {
      try {
        const cut = await postJson("/api/cut", { id: c.id, start: state.selStart, end: state.selEnd });
        applyClip(cut);
        state.origStart = state.selStart;
        state.origEnd = state.selEnd;
        selMeta();
      } catch (err) {
        setStatus(err.message, true);
        return;
      }
    }
    setStatus(on ? "Saving…" : "Removing…");
    try {
      const data = await postJson("/api/use", { id: c.id, slot: slot, on: on });
      applyClip(data);
      setStatus(USE_MSG[slot][on ? 0 : 1]);
    } catch (err) {
      setStatus(err.message, true);
    }
  }

  let barkPrev = null;
  function stopBarkPreview() {
    if (!barkPrev) return;
    barkPrev.nodes.forEach((n) => { try { n.stop(); } catch (_) {} });
    barkPrev = null;
  }

  document.getElementById("previewBark").onclick = async () => {
    const c = currentClip();
    if (!c || !(c.extended || c.src)) return;
    player.pause();
    stopBarkPreview();
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") await actx.resume();
      const srcUrl = asset(c.extended || c.src);
      const buf = await actx.decodeAudioData((await (await fetch(srcUrl)).arrayBuffer()).slice(0));
      const t = actx.currentTime;
      const lead = 0.5;
      const dur = Math.max(0.2, state.selEnd - state.selStart);
      const start = Math.max(0, state.selStart);
      const fadeIn = Math.min(0.35, Math.max(0.06, dur * 0.22));
      const fadeOut = Math.min(0.42, Math.max(0.08, dur * 0.28));
      function knock(at) {
        const osc = actx.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(92, at);
        osc.frequency.exponentialRampToValueAtTime(40, at + 0.12);
        const g = actx.createGain();
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(0.18, at + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, at + 0.12);
        osc.connect(g);
        g.connect(actx.destination);
        osc.start(at);
        osc.stop(at + 0.14);
      }
      knock(t);
      const voice = actx.createBufferSource();
      voice.buffer = buf;
      const vg = actx.createGain();
      const voiceAt = t + lead;
      vg.gain.setValueAtTime(0.0001, voiceAt);
      vg.gain.linearRampToValueAtTime(0.9, voiceAt + fadeIn);
      const fadeOutAt = voiceAt + Math.max(fadeIn + 0.05, dur - fadeOut);
      vg.gain.setValueAtTime(0.9, fadeOutAt);
      vg.gain.linearRampToValueAtTime(0.0001, voiceAt + dur);
      voice.connect(vg);
      vg.connect(actx.destination);
      voice.start(voiceAt, start, dur);
      knock(voiceAt + dur + 0.08);
      barkPrev = { nodes: [voice] };
      setStatus("Gavel in · voice · gavel out");
    } catch (err) {
      setStatus(err.message, true);
    }
  };

  document.getElementById("resetCut").onclick = async () => {
    const c = currentClip();
    if (!c) return;
    try {
      const res = await fetch(API + "/api/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: c.id })
      });
      const data = await res.json();
      if (data.ok) {
        const i = clips.findIndex((x) => x.id === c.id);
        clips[i] = Object.assign(clips[i], data.clip);
        c = clips[i];
      }
    } catch (_) {}
    state.selStart = c.selStart != null ? c.selStart : state.origStart;
    state.selEnd = c.selEnd != null ? c.selEnd : state.origEnd;
    state.origStart = state.selStart;
    state.origEnd = state.selEnd;
    clampSel();
    selMeta();
    draw();
    playCut();
  };

  function setStatus(msg, err) {
    const el = document.getElementById("cutStatus");
    el.textContent = msg;
    el.className = err ? "err" : "";
  }

  document.querySelectorAll(".tab").forEach((b) => b.onclick = () => {
    document.querySelectorAll(".tab").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
    state.house = b.dataset.house;
    render();
  });
  document.querySelectorAll(".chip[data-trig]").forEach((b) => b.onclick = () => {
    document.querySelectorAll(".chip[data-trig]").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
    state.trig = b.dataset.trig;
    if (state.trig === "captures") {
      state.readyOnly = false;
      document.getElementById("readyOnly").classList.toggle("on", false);
    }
    render();
  });
  document.getElementById("readyOnly").onclick = function () {
    state.readyOnly = !state.readyOnly;
    this.classList.toggle("on", state.readyOnly);
    render();
  };
  document.querySelectorAll(".chip[data-use]").forEach((b) => b.onclick = () => {
    const next = b.dataset.use;
    const off = state.use === next;
    state.use = off ? "all" : next;
    document.querySelectorAll(".chip[data-use]").forEach((x) => x.classList.toggle("on", x.dataset.use === state.use));
    render();
  });
  document.getElementById("reelClose").onclick = closeReel;
  document.getElementById("reelBox").addEventListener("click", (e) => {
    if (e.target.id === "reelBox") closeReel();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && document.getElementById("reelBox").classList.contains("on")) {
      e.preventDefault();
      closeReel();
    }
  });
  document.getElementById("q").addEventListener("input", (e) => {
    state.q = e.target.value;
    render();
  });
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input")) return;
    if (e.code === "Space") { e.preventDefault(); playCut(); }
    if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); step(1); }
    if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); step(-1); }
    if (e.key === "[") { state.selStart -= e.shiftKey ? 0.5 : 0.05; clampSel(); selMeta(); draw(); }
    if (e.key === "]") { state.selStart += e.shiftKey ? 0.5 : 0.05; clampSel(); selMeta(); draw(); }
    if (e.key === "-") { state.selEnd -= e.shiftKey ? 0.5 : 0.05; clampSel(); selMeta(); draw(); }
    if (e.key === "=" || e.key === "+") { state.selEnd += e.shiftKey ? 0.5 : 0.05; clampSel(); selMeta(); draw(); }
  });
  window.addEventListener("resize", draw);

  function asset(path) {
    if (!path) return path;
    if (/^https?:/i.test(path)) return path;
    return API + "/" + path.replace(/^\//, "");
  }

  fetch(API + "/api/clips", { cache: "no-store" }).then((r) => {
    if (!r.ok) throw new Error("down");
    if (location.protocol === "file:") location.replace("http://127.0.0.1:8765/");
    return r.json();
  }).then((d) => {
    if (d && Array.isArray(d.clips) && d.clips.length) {
      clips = d.clips;
      window.CLIPS = clips;
      render();
    }
  }).catch(() => {
    setStatus("Open http://127.0.0.1:8765/ to save cuts — or double-click Open Soundbites.command", true);
  });

  render();
})();
</script>
</body>
</html>
